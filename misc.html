<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Xiao Fu</title>
  <style>
    .memory_wrapper {
      max-width: -webkit-calc(1400px - (50px * 2));
      max-width: calc(1400px - (50px * 2));
      margin-right: auto;
      margin-left: auto;
      padding-right: 50px;
      padding-left: 50px;
    }

    div.img {
      border: 1px solid #ccc;
    }

    div.img:hover {
      border: 1px solid #777;
    }

    div.img img {
      width: 100%;
      height: auto;
    }

    div.desc {
      padding: 10px;
      text-align: center;
    }

    * {
      box-sizing: border-box;
    }

    .responsive {
      padding: 0 6px;
      float: left;
      width: 24.99999%;
    }

    @media only screen and (max-width: 700px) {
      .responsive {
        width: 49.99999%;
        margin: 6px 0;
      }
    }

    @media only screen and (max-width: 500px) {
      .responsive {
        width: 100%;
      }
    }

    .clearfix:after {
      content: "";
      display: table;
      clear: both;
    }
  </style>
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico?">
</head>

<body>
  <header class="site-header">
    <div class="memory_wrapper">
      <nav class="site-nav">
        <!-- About -->
        <a class="page-link" href="/">Home</a>
        <!-- Memory -->
        <a class="page-link" href="/memory.html">Memory</a>
        <!-- Misc -->
        <a class="page-link" href="/misc.html">Misc</a>
      </nav>
    </div>
  </header>

  <div class="memory_wrapper">
    <h2 style="text-align:center; margin-top:80px; margin-bottom:20px">Zhejiang University(2018-2022)</h2>

    <div class="responsive">
      <div class="img">
        <img src="/assets/img/memory/yiyi.png" alt="YYL Gathering">
        <div class="desc">YYL's Gathering</div>
      </div>
      <div style="margin-bottom:20px"> </div>
    </div>

    <div class="responsive">
      <div class="img">
        <img src="/assets/img/memory/isee_honor.png" alt="ISEE Excellent Student">
        <div class="desc">ISEE Excellent Student</div>
      </div>
      <div style="margin-bottom:20px"> </div>
    </div>

    <div class="responsive">
      <div class="img">
        <img src="/assets/img/memory/xiaohuangyin.png" alt="With Xiaohuang Yin">
        <div class="desc">With Xiaohuang Yin</div>
      </div>
      <div style="margin-bottom:20px"> </div>
    </div>

    <div class="responsive">
      <div class="img">
        <img src="/assets/img/memory/gold_prize_2021.png" alt="Gold Prize of Internet+">
        <div class="desc">Gold Prize of "Internet+"</div>
      </div>
      <div style="margin-bottom:20px"> </div>
    </div>

    <div class="clearfix"></div>
  </div>
</body>

</html>
